<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karenya 小遊戲</title>
<style>
  :root { --ink: #3b2f2a; --soft: #8a7464; --accent: #e08a52; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: system-ui, "Noto Sans CJK TC", "PingFang TC", sans-serif; line-height: 1.6;
    background: linear-gradient(#2a2340 0, #4a3d6e 340px, #f3e3cc 340px, #f6efe4 100%); min-height: 100vh; }
  header { position: relative; height: 300px; overflow: hidden; text-align: center; color: #fbeec8; }
  /* 夜空插畫：星星、月亮、屋頂剪影（純 CSS） */
  .stars { position: absolute; inset: 0; background-image:
      radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 30% 60%, #fff, transparent),
      radial-gradient(2px 2px at 55% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 72% 40%, #fff, transparent),
      radial-gradient(2px 2px at 88% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 42% 35%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 20% 45%, #fff, transparent), radial-gradient(2px 2px at 64% 58%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .5 } to { opacity: 1 } }
  .moon { position: absolute; top: 34px; right: 12%; width: 70px; height: 70px; border-radius: 50%; box-shadow: -14px 10px 0 0 #f6e6a8; transform: rotate(-20deg); }
  @media (max-width: 600px) { .moon { top: 14px; right: 6%; width: 40px; height: 40px; box-shadow: -8px 6px 0 0 #f6e6a8; } }
  .roofs { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background:
      linear-gradient(135deg, transparent 50%, #1d1830 50%) 0 0 / 80px 40px repeat-x,
      linear-gradient(225deg, transparent 50%, #1d1830 50%) 40px 0 / 80px 40px repeat-x;
    }
  .roofs::after { content: ''; position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: #1d1830;
    background-image: radial-gradient(circle, #ffd27a 3px, transparent 4px); background-size: 60px 26px; background-position: 20px 6px; }
  .title { position: relative; padding-top: 70px; }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); letter-spacing: .08em; text-shadow: 0 3px 0 #1d1830; }
  .title p { margin: 4px 0 0; color: #d9c8f0; }
  main { max-width: 1040px; margin: -10px auto 0; padding: 0 16px 24px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); position: relative; }
  .card { display: block; text-decoration: none; color: inherit; background: #fffaf2; border-radius: 22px; overflow: hidden;
    box-shadow: 0 10px 28px #3a254026; border: 1px solid #ead9c4; transition: transform .2s; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); }
  .stage { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #2a2340; }
  .stage iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
  .stage .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s; }
  .card:hover .cover, .card:focus-visible .cover { opacity: 0; }
  .live { position: absolute; top: 10px; left: 10px; background: #0007; color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .live::before { content: '●'; color: #ff6b6b; margin-right: 4px; }
  .body { padding: 16px 20px 20px; display: grid; gap: 8px; }
  .card h2 { margin: 0; font-size: 22px; }
  .card p { margin: 0; color: var(--soft); }
  .play { text-align: center; background: var(--accent); color: #fff; font-weight: bold; padding: 12px; border-radius: 12px; }
  footer { text-align: center; color: var(--soft); font-size: 13px; padding: 8px 16px 40px; }
</style>
</head>
<body>
<header>
  <div class="stars"></div><div class="moon"></div><div class="roofs"></div>
  <div class="title"><h1>Karenya 小遊戲</h1><p>夜深了，挑一款慢慢玩。</p></div>
</header>
<main id="games"></main>
<footer>原型階段・美術陸續替換中</footer>
<script>
  // 新增遊戲只要在這裡加一筆。preview＝縮圖用的即時預覽頁（加 ?preview 會自動示範、隱藏介面）
  // cover＝封面插畫（可選，檔案不存在就只顯示即時預覽）
  const GAMES = [
    { id: 'witch-suitcase', title: '魔女的行李箱', desc: '把六件有脾氣的魔法物品塞進行李箱，看看會怎麼出發。',
      href: 'games/witch-suitcase/index.html', preview: 'games/witch-suitcase/index.html?preview', size: [1066, 426], cover: 'covers/witch-suitcase.png' },
    { id: 'borrow-a-window', title: '借一扇窗', desc: '透過一扇窗望出去，在三十秒的風景裡找找藏起來的小東西。',
      href: 'games/borrow-a-window/dist/index.html', preview: 'games/borrow-a-window/dist/index.html?preview', size: [1280, 800], cover: 'covers/borrow-a-window.png' },
  ];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const root = document.getElementById('games');
  root.innerHTML = GAMES.map((g) => `
    <a class="card" href="${esc(g.href)}" data-game="${esc(g.id)}">
      <div class="stage">
        <iframe src="${esc(g.preview)}" width="${g.size[0]}" height="${g.size[1]}" tabindex="-1" aria-hidden="true" loading="lazy" title="${esc(g.title)} 預覽"></iframe>
        ${g.cover ? `<img class="cover" src="${esc(g.cover)}" alt="" onerror="this.remove()">` : ''}
        <span class="live">即時預覽</span>
      </div>
      <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p><span class="play">開始玩 →</span></div>
    </a>`).join('');
  // 依卡片寬度縮放 iframe，讓整個遊戲畫面置中填滿
  const fit = () => document.querySelectorAll('.stage').forEach((st) => {
    const f = st.querySelector('iframe'), W = +f.width, H = +f.height;
    const s = Math.min(st.clientWidth / W, st.clientHeight / H); // 完整顯示整個遊戲畫面
    f.style.transform = `translate(${(st.clientWidth - W * s) / 2}px, ${(st.clientHeight - H * s) / 2}px) scale(${s})`;
  });
  new ResizeObserver(fit).observe(root); fit();
</script>
</body>
</html>
